<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的主页</title>
  <style>
    :root {
      --bg: #f7f8fa;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #2563eb;
      --accent-soft: #eaf1fe;
      --border: #e5e7eb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                   "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
    }
    .container { max-width: 720px; margin: 0 auto; padding: 0 20px; }

    header {
      text-align: center;
      padding: 64px 0 40px;
    }
    .avatar {
      width: 96px; height: 96px; border-radius: 50%;
      background: var(--accent-soft);
      color: var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-size: 36px; font-weight: 700;
      margin: 0 auto 20px;
      letter-spacing: 2px;
    }
    header h1 { font-size: 28px; font-weight: 700; }
    header .subtitle { color: var(--muted); margin-top: 6px; font-size: 16px; }

    section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px;
      margin-bottom: 24px;
    }
    section h2 {
      font-size: 18px;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    section p { color: var(--muted); }

    /* 文件下载区 */
    .file-list { list-style: none; }
    .file-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 10px;
      background: #fafbfc;
    }
    .file-item:last-child { margin-bottom: 0; }
    .file-info { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .file-icon {
      flex-shrink: 0;
      width: 40px; height: 40px; border-radius: 8px;
      background: var(--accent-soft); color: var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700;
    }
    .file-name { font-weight: 600; font-size: 15px; }
    .file-desc { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .download {
      flex-shrink: 0;
      background: var(--accent); color: #fff;
      text-decoration: none; font-size: 14px; font-weight: 600;
      padding: 8px 18px; border-radius: 8px;
      transition: opacity .15s;
    }
    .download:hover { opacity: .85; }

    .hint {
      font-size: 13px; color: var(--muted);
      background: var(--accent-soft);
      border-radius: 8px; padding: 10px 14px; margin-top: 16px;
    }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      padding: 24px 0 48px;
    }
    footer a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <!-- 头像会显示你名字的第一个字，下面 name 改掉它自动变 -->
      <div class="avatar" id="avatar">你</div>
      <h1 id="name">你的名字</h1>
      <p class="subtitle" id="subtitle">一句自我介绍，比如「本科生 · 经济学理论方向」</p>
    </header>

    <section>
      <h2>关于我</h2>
      <p id="about">
        这里写一段自我介绍。比如：我是在读本科生，对经济学理论、投票与信息加总、
        博弈论感兴趣。这个网站用来分享我的一些资料和文件。
      </p>
    </section>

    <section>
      <h2>我的文件</h2>
      <ul class="file-list">

        <!-- ============ 下载区：照着下面这一整块复制，改 3 个地方即可 ============ -->
        <li class="file-item">
          <div class="file-info">
            <div class="file-icon">PDF</div>
            <div>
              <div class="file-name">示例文件.pdf</div>
              <div class="file-desc">这是一份示例说明文件</div>
            </div>
          </div>
          <a class="download" href="示例文件.pdf" download>下载</a>
        </li>
        <!-- ============ 上面就是一个完整「文件条目」的模板 ============ -->

      </ul>

      <div class="hint">
        💡 <strong>如何添加新文件？</strong> 把文件上传到 GitHub 仓库后，在 GitHub 网页上打开
        <code>index.html</code> 点右上角铅笔图标编辑，复制上面「示例文件」那一整块
        <code>&lt;li&gt;…&lt;/li&gt;</code>，把里面的文件名改成你的文件即可。
      </div>
    </section>

    <footer>
      由 GitHub Pages 托管 · <a href="https://pages.github.com" target="_blank">pages.github.com</a>
    </footer>
  </div>

  <script>
    // 改完上面 header 里的名字后，刷新页面，头像会自动取第一个字。
    const nameEl = document.getElementById('name');
    const avatarEl = document.getElementById('avatar');
    avatarEl.textContent = nameEl.textContent.trim().charAt(0) || '你';
  </script>
</body>
</html>
